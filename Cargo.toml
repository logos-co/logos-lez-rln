[workspace]
resolver = "3"
members = [
  "methods",
  "methods/guest",
  "rln-layouts",
]

[package]
name = "logos-lez-rln"
version = "0.1.0"
edition = "2024"

[lib]
name = "logos_lez_rln"
path = "src/lib.rs"

[dependencies]
# LSSA dependencies via git
nssa = { git = "https://github.com/logos-blockchain/lssa.git", branch = "main" }
nssa_core = { git = "https://github.com/logos-blockchain/lssa.git", branch = "main" }
wallet = { git = "https://github.com/logos-blockchain/lssa.git", branch = "main" }

# Shared layouts
rln-layouts = { path = "rln-layouts" }

# External dependencies
tokio = { version = "1.28.2", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"
bytemuck = "1.24.0"
rln = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[[bin]]
name = "run_rln_proof"
path = "src/bin/run_rln_proof.rs"

[[bin]]
name = "run_query_root"
path = "src/bin/run_query_root.rs"

[[bin]]
name = "bulk_register"
path = "src/bin/bulk_register.rs"

[[bin]]
name = "run_setup"
path = "src/bin/run_setup.rs"

[[bin]]
name = "rln_service"
path = "src/bin/rln_service.rs"

[workspace.dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/lssa.git", branch = "main" }
risc0-zkvm = { version = "3.0.3", features = ["std"] }
risc0-build = "3.0.3"
bytemuck = "1.24.0"
rln-layouts = { path = "rln-layouts", default-features = false }
token_core = { git = "https://github.com/logos-blockchain/lssa.git", branch = "main" }
