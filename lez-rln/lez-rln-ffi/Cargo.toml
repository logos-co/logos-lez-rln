[package]
name = "lez-rln-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
rln-layouts = { path = "../rln-layouts" }
rln = { version = "2.0.2", default-features = false, features = ["stateless"] }
sha2 = "0.10"
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }

[build-dependencies]
cbindgen = "0.29"
