[workspace]
resolver = "3"
members = [
  "rln-layouts",
  "lez-rln-ffi",
]

[package]
name = "logos-lez-rln"
version = "0.1.0"
edition = "2024"

[lib]
name = "logos_lez_rln"
path = "src/lib.rs"

[dependencies]
# LSSA dependencies via the lssa submodule (upstream rc6 renamed nssa->lee,
# nssa_core->lee_core; package aliasing keeps the lez-rln source unchanged).
nssa = { package = "lee", path = "../lssa/lee/state_machine" }
nssa_core = { package = "lee_core", path = "../lssa/lee/state_machine/core" }
wallet = { path = "../lssa/lez/wallet" }
common = { path = "../lssa/lez/common" }
sequencer_service_rpc = { path = "../lssa/lez/sequencer/service/rpc", features = ["client"] }
programs = { path = "../lssa/lez/programs" }

rln-layouts = { path = "rln-layouts" }

# External dependencies
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"
bytemuck = "1.24.0"
rln = { version = "2.0.2", default-features = false, features = ["stateless"] }

[features]
rc5-state-tests = []
# Privacy-flow tests use SharedSecretKey::encapsulate_deterministic which is
# gated behind lee_core's test_utils feature.
rc5-state-tests-privacy = ["rc5-state-tests", "nssa_core/test_utils"]

[[bin]]
name = "run_rln_proof"
path = "src/bin/run_rln_proof.rs"

[[bin]]
name = "run_setup"
path = "src/bin/run_setup.rs"

[[bin]]
name = "register_member"
path = "src/bin/register_member.rs"

[dev-dependencies]
nssa = { package = "lee", path = "../lssa/lee/state_machine", features = ["test-utils"] }
token_core = { path = "../lssa/lez/programs/token/core" }
clock_core = { path = "../lssa/lez/programs/clock/core" }

[workspace.dependencies]
rln-layouts = { path = "rln-layouts", default-features = false }
