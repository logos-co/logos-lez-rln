[workspace]
resolver = "3"
members = [
  "rln-layouts",
  "lez-rln-ffi",
]

[package]
name = "logos-lez-rln"
version = "0.1.0"
edition = "2024"

[lib]
name = "logos_lez_rln"
path = "src/lib.rs"

[dependencies]
# LSSA dependencies via git
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3", features = ["client"] }

rln-layouts = { path = "rln-layouts" }

# External dependencies
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"
bytemuck = "1.24.0"
rln = { version = "2.0.2", default-features = false, features = ["stateless"] }
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "run_rln_proof"
path = "src/bin/run_rln_proof.rs"

[[bin]]
name = "run_setup"
path = "src/bin/run_setup.rs"

[[bin]]
name = "register_member"
path = "src/bin/register_member.rs"

[dev-dependencies]
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3", features = ["test-utils"] }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }

[workspace.dependencies]
rln-layouts = { path = "rln-layouts", default-features = false }
