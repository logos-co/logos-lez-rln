[workspace]
resolver = "3"
members = ["."]

# Guest [profile.release]: the binding constraint is the executed cycle budget,
# not binary size. Measured via src/cycle_harness.rs (gated rc5-state-tests):
# merkle Initialize 18.2M and Insert 18.7M user cycles — ~55% of the sequencer's
# 2^25 (33.55M) per-execution session limit, i.e. ~1.8x headroom. A codegen
# change that pushes cycles past that ceiling is silently dropped from blocks
# (reason only in the sequencer log). `strip` and `debug=false` touch only
# non-loaded sections and are cycle-neutral; `opt-level="s"/"z"` is the one
# genuinely cycle-risky knob. Rule: gate every profile change on the cycle
# harness, and land the risc0-bigint2 Poseidon precompile (field::modmul_256)
# before opt-level=z — that is what buys back the headroom.
#
# The deploy artifact is the llvm-stripped R0BF .bin the build.rs post-step
# produces (~455 KB for registration), not the unstripped ~648 KB ELF. The
# binding size limit is the operator's max_block_size — measured on the public
# testnet between ~266 KB and ~459 KB — not a fixed 511 KB.

[package]
name = "logos_lez_rln_guest"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

# Gated on cycle_harness (src/cycle_harness.rs). Measured effects vs default:
#   lto=fat + codegen-units=1  : -34 KB, cycles SLIGHTLY LOWER (Insert 18.69M->18.58M) — SAFE.
#   + opt-level="z"            : a further -123 KB, but BLOWS the 2^25 cycle cap
#                               (Init/Insert both exceed 33,554,432 -> guest dropped
#                               on-chain; 52/81 tests fail). opt-level=z de-optimizes
#                               the software Poseidon field arithmetic despite the
#                               source-level unroll hints. It is unlocked ONLY after the
#                               risc0-bigint2 Poseidon precompile buys ~5-7x cycle
#                               headroom (see plan Phase 3A). Do NOT re-add it before then.
[profile.release]
lto = "fat"
codegen-units = 1

[lints]
workspace = true

[dependencies]
# rc6 lssa fetched as git deps (nssa_core->lee_core; package alias keeps guest
# source unchanged). Pinned by tag so a fresh clone builds with no sibling checkout.
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2", default-features = false }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
borsh = { version = "1", default-features = false, features = ["derive"] }
bytemuck = "1.24.0"
risc0-zkvm = { version = "3.0.5", default-features = false }
rln-layouts = { path = "../../rln-layouts", default-features = false }
rust-poseidon-bn254-pure = { git = "https://github.com/logos-storage/rust-poseidon-bn254-pure", rev = "49e1042" }
# spel-framework must target the SAME lee_core as the guest (v0.2.2). This rev
# (adklempner/spel branch lez-v0.2.2-compat, based on 0x-r4bbit/spel@91023c9)
# bumps spel's lez pins to v0.2.2 and makes program output carry EVERY declared
# account — v0.2.2's DeclaredAccountMissingFromOutput check silently drops from
# blocks any tx whose program output omits one. Upstream spel has no v0.2.2
# support yet; fold this back when it does. Keep this and nssa_core above on
# the same LEZ release.
spel-framework = { git = "https://github.com/adklempner/spel.git", rev = "6e8c7d3a1d7c26d4a18f9476ca74412d45fb41d2" }

# NOTE: the risc0 guest toolchain is rustc 1.88; some transitive deps have newer
# MSRVs and must be held back in Cargo.lock (cargo update --precise), or
# `cargo risczero build` fails resolving 1.88-incompatible versions:
#   enum-ordinalize / enum-ordinalize-derive pinned to 4.3.2 (4.4.x needs 1.89)
#   ruint pinned to 1.17.0 (1.18+ needs 1.90)
#   sha2 pinned to 0.10.8 so the risc0 SHA-256 accelerator patch below applies
#     (risc0's patch table covers 0.10.8/0.10.7/0.10.6/0.9.9, not 0.10.9)
# Re-pin after any `cargo update` that bumps them.

# risc0's drop-in SHA-256 replaces the ~17 KB software compress256 with the
# rv32im SHA circuit ecall: fewer bytes AND fewer cycles, with byte-identical
# output so every PDA/account-id is unchanged. Engaged by the RISC0_FEATURE_*
# env risc0-build sets for the guest. https://dev.risczero.com/api/zkvm/precompiles
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[[bin]]
name = "incremental_merkle_tree"
path = "src/bin/incremental_merkle_tree.rs"

[[bin]]
name = "rln_registration"
path = "src/bin/rln_registration.rs"

# Phase A lint policy — mirrored from the host workspace (lez-rln/Cargo.toml)
# since guest is a separate workspace and can't inherit [workspace.lints].
# Phase B lints (unwrap_used, allow_attributes*, arithmetic_side_effects,
# indexing_slicing, cast discipline) are a tracked follow-up.
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_enum_variant = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"