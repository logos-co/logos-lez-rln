[package]
name    = "lez_rln_module"
version = "1.0.0"
edition = "2021"

[lib]
name = "liblogos_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory. lez-rln-src/ is excluded so the staged
# rln-layouts crate under it resolves on its own instead of being auto-adopted
# as a member here.
[workspace]
exclude = ["lez-rln-src"]

# Panicking across the FFI boundary is UB; mirror chat_module's setting.
[profile.release]
panic = "abort"

[dependencies]
# The RLN register/proof/funding logic lives IN this crate (src/rln_core.rs).
# It depends directly on the shared borsh-layout crate rln-layouts, staged at
# lez-rln-src/rln-layouts (a copy of ../../lez-rln/rln-layouts). The staged copy
# must live INSIDE this crate dir: mkLogosModule's rustCrateSrc stages only the
# crate directory (plus logos-rust-sdk-src), so a ../../lez-rln path dep cannot
# survive the builder's vendoring. Refresh with:
#   rsync -a --delete --exclude target --exclude .git \
#     ../../lez-rln/rln-layouts/ lez-rln-src/rln-layouts/
rln-layouts = { path = "lez-rln-src/rln-layouts" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc6" }
rln = { version = "2.0.2", default-features = false, features = ["stateless"] }
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
sha2 = "0.10"
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }

# The runtime SDK, staged by the module builder (codegen.rust) at this
# path from the same logos-rust-sdk rev its generator came from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
serde_json = "1"
